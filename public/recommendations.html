<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OS Recommendation Inbox</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui;background:#0a0d10;color:#f5f7f9}*{box-sizing:border-box}body{margin:0}.shell{width:min(1100px,100%);margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#8793a0}h1{font-size:26px;margin:4px 0 6px}.muted{font-size:13px;color:#8e9aa7;line-height:1.45}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid #313b46;background:#11171d;color:#fff;border-radius:9px;padding:9px 11px}.card{background:#11151a;border:1px solid #252d36;border-radius:13px;padding:13px;margin:10px 0}.head{display:flex;justify-content:space-between;gap:12px}.title{font-weight:700}.meta{font-size:11px;color:#8793a0;margin-top:4px}.objective{font-size:13px;line-height:1.5;margin-top:10px}.actions{display:flex;gap:8px;margin-top:12px}.approve{border-color:#2c6244;color:#91e8b3}.reject{border-color:#6d3138;color:#ff9aa5}.pill{font-size:10px;padding:4px 7px;border:1px solid #39434f;border-radius:999px;text-transform:uppercase}.opportunity-radar{color:#9dc9ff}.revenue-hunter{color:#e8c987}.auth{position:fixed;inset:0;background:rgba(5,7,9,.94);display:grid;place-items:center;padding:18px}.box{width:min(420px,100%);background:#12171d;border:1px solid #303946;border-radius:14px;padding:17px}.box input{width:100%;padding:11px;background:#090c0f;border:1px solid #36424e;border-radius:9px;color:#fff;margin:12px 0}.hidden{display:none!important}
</style>
</head>
<body>
<div id="auth" class="auth hidden"><div class="box"><div class="eyebrow">Owner-only</div><h2>Recommendation inbox</h2><p class="muted">Enter your Operating System access token. It stays in this browser session.</p><input id="token" type="password" placeholder="OS_ACCESS_TOKEN"><button id="unlock" class="btn" style="width:100%">Unlock</button><p id="err" style="color:#ff9aa5"></p></div></div>
<main class="shell"><header class="top"><div><div class="eyebrow">Operating System · Decision authority</div><h1>Recommendation Inbox</h1><p class="muted">Opportunity Radar and Revenue Hunter arrive here independently. Nothing reaches AI Factory until you approve it.</p></div><button id="refresh" class="btn">Refresh</button></header><div class="tabs"><button class="btn" data-status="received">Received</button><button class="btn" data-status="approved">Approved</button><button class="btn" data-status="dispatched">Dispatched</button><button class="btn" data-status="completed">Completed</button><button class="btn" data-status="all">All</button></div><div id="list"></div></main>
<script>
const $=s=>document.querySelector(s);let token=sessionStorage.getItem('os_access_token')||'';let status='received';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showAuth(msg=''){ $('#auth').classList.remove('hidden');$('#err').textContent=msg }
async function req(path,opts={}){const r=await fetch(path,{...opts,headers:{...(opts.headers||{}),'authorization':`Bearer ${token}`,'content-type':'application/json'}});if(r.status===401){showAuth('Token not accepted.');throw new Error('unauthorized')}const data=await r.json();if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
async function load(){try{const q=status==='all'?'':`?status=${encodeURIComponent(status)}`;const data=await req('/api/integrations/recommendations'+q);render(data.recommendations||[])}catch(e){if(e.message!=='unauthorized')$('#list').innerHTML=`<p style="color:#ff9aa5">${esc(e.message)}</p>`}}
function render(items){$('#list').innerHTML=items.length?items.map(r=>`<article class="card"><div class="head"><div><div class="title">${esc(r.title)}</div><div class="meta">${esc(r.source_system)} · priority ${esc(r.priority)} · confidence ${Math.round(Number(r.confidence||0)*100)}%</div></div><span class="pill ${esc(r.source_system)}">${esc(r.status)}</span></div><div class="objective">${esc(r.objective||'No executable objective supplied yet.')}</div>${r.status==='received'?`<div class="actions"><button class="btn approve" onclick="approve('${esc(r.id)}')">Approve → Factory</button><button class="btn reject" onclick="rejectRec('${esc(r.id)}')">Reject</button></div>`:''}</article>`).join(''):'<p class="muted">Nothing in this state.</p>'}
async function approve(id){await req(`/api/integrations/recommendations/${encodeURIComponent(id)}/approve`,{method:'POST',body:'{}'});load()}
async function rejectRec(id){const reason=prompt('Reason for rejection (optional)')||'';await req(`/api/integrations/recommendations/${encodeURIComponent(id)}/reject`,{method:'POST',body:JSON.stringify({reason})});load()}
$('#unlock').onclick=()=>{token=$('#token').value.trim();sessionStorage.setItem('os_access_token',token);$('#auth').classList.add('hidden');load()};$('#refresh').onclick=load;document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{status=b.dataset.status;load()});if(!token)showAuth();else load();
</script>
</body></html>
