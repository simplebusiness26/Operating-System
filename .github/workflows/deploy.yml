name: Deploy Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy.yml'
permissions:
  contents: write
jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync GitHub webhook secret to Cloudflare
        run: printf '%s' "$GITHUB_WEBHOOK_SECRET" | npx wrangler secret put GITHUB_WEBHOOK_SECRET
        env:
          GITHUB_WEBHOOK_SECRET: ${{ secrets.OS_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync OS and Radar secrets to Cloudflare
        run: |
          if [ -n "$OS_ACCESS_TOKEN" ]; then
            printf '%s' "$OS_ACCESS_TOKEN" | npx wrangler secret put OS_ACCESS_TOKEN
          else
            echo "OS_ACCESS_TOKEN not configured in GitHub; leaving the Worker secret unchanged."
          fi
          if [ -n "$RADAR_SYNC_TOKEN" ]; then
            printf '%s' "$RADAR_SYNC_TOKEN" | npx wrangler secret put RADAR_SYNC_TOKEN
          else
            echo "RADAR_SYNC_TOKEN not configured in GitHub; Radar bridge remains disabled."
          fi
        env:
          OS_ACCESS_TOKEN: ${{ secrets.OS_ACCESS_TOKEN }}
          RADAR_SYNC_TOKEN: ${{ secrets.RADAR_SYNC_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Force-enable workers.dev route
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/personal-operating-system/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"enabled":true,"previews_enabled":true}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify workers.dev routing
        run: |
          ACCOUNT_JSON=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          ROUTE_JSON=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/personal-operating-system/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "Account workers.dev response: ${ACCOUNT_JSON}"
          echo "Worker route response: ${ROUTE_JSON}"
          SUBDOMAIN=$(printf '%s' "$ACCOUNT_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')
          URL="https://personal-operating-system.${SUBDOMAIN}.workers.dev/api/health"
          echo "Canonical health URL: ${URL}"
          for i in 1 2 3 4 5 6; do
            if curl --fail-with-body --silent --show-error --max-time 15 "${URL}"; then
              echo
              echo "Public health check passed: ${URL}"
              exit 0
            fi
            echo "Health check attempt ${i} failed; retrying in 10s..."
            sleep 10
          done
          echo "Cloudflare reports the route enabled, but the public hostname is still unreachable: ${URL}"
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Import GitHub inventory and verify Radar bridge
        if: success()
        shell: bash
        env:
          RADAR_SYNC_TOKEN: ${{ secrets.RADAR_SYNC_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER_NAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ACCOUNT_JSON=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          SUBDOMAIN=$(printf '%s' "$ACCOUNT_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')
          BASE_URL="https://personal-operating-system.${SUBDOMAIN}.workers.dev"
          HEALTH_URL="${BASE_URL}/api/health"

          CONFIGURED=false
          INVENTORY_CONFIGURED=false
          for i in 1 2 3 4 5 6; do
            HEALTH_JSON=$(curl --fail-with-body --silent --show-error --max-time 15 "$HEALTH_URL")
            CONFIGURED=$(printf '%s' "$HEALTH_JSON" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("radarSyncConfigured"))).lower())')
            INVENTORY_CONFIGURED=$(printf '%s' "$HEALTH_JSON" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("githubInventoryConfigured"))).lower())')
            if [ "$CONFIGURED" = "true" ] && [ "$INVENTORY_CONFIGURED" = "true" ]; then break; fi
            echo "Waiting for the new Worker configuration to propagate..."
            sleep 10
          done

          if [ -n "$RADAR_SYNC_TOKEN" ]; then REPO_SECRET_PRESENT=true; else REPO_SECRET_PRESENT=false; fi

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_API_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${GITHUB_OWNER_NAME}/repos?per_page=100&type=owner&sort=updated&direction=desc" \
            > /tmp/github-repos.json

          GITHUB_OWNER_NAME="$GITHUB_OWNER_NAME" python - <<'PY' > /tmp/os-github-inventory.json
          import json, os
          repos = json.load(open('/tmp/github-repos.json'))
          safe = []
          keep = {
              'name','full_name','html_url','description','homepage','language','topics',
              'fork','archived','disabled','pushed_at','updated_at','visibility','owner'
          }
          for repo in repos:
              item = {k: repo.get(k) for k in keep if k in repo}
              if isinstance(item.get('owner'), dict):
                  item['owner'] = {'login': item['owner'].get('login')}
              safe.append(item)
          print(json.dumps({'owner': os.environ['GITHUB_OWNER_NAME'], 'repositories': safe}))
          PY

          SYNC_STATUS="not_attempted"
          REPOSITORIES_SEEN=0
          PROJECTS_UPSERTED=0
          EVIDENCE_CREATED=0
          if [ "$CONFIGURED" = "true" ] && [ -n "$RADAR_SYNC_TOKEN" ]; then
            HTTP_CODE=$(curl --silent --show-error --max-time 90 \
              --output /tmp/os-github-import-result.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${RADAR_SYNC_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/os-github-inventory.json \
              "${BASE_URL}/api/github/inventory")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              SYNC_STATUS="success"
              REPOSITORIES_SEEN=$(python -c 'import json; d=json.load(open("/tmp/os-github-import-result.json")); print(d.get("inventory",{}).get("repositoriesSeen",0))')
              PROJECTS_UPSERTED=$(python -c 'import json; d=json.load(open("/tmp/os-github-import-result.json")); print(d.get("inventory",{}).get("projectsUpserted",0))')
              EVIDENCE_CREATED=$(python -c 'import json; d=json.load(open("/tmp/os-github-import-result.json")); print(d.get("inventory",{}).get("evidenceCreated",0))')
            else
              SYNC_STATUS="failed_http_${HTTP_CODE}"
              cat /tmp/os-github-import-result.json || true
            fi
          elif [ "$CONFIGURED" = "true" ]; then
            SYNC_STATUS="bridge_token_missing_from_workflow"
          else
            SYNC_STATUS="bridge_not_configured"
          fi

          export CONFIGURED INVENTORY_CONFIGURED REPO_SECRET_PRESENT SYNC_STATUS HEALTH_URL REPOSITORIES_SEEN PROJECTS_UPSERTED EVIDENCE_CREATED
          mkdir -p status
          python - <<'PY' > status/os-radar-bridge.json
          import json, os
          from datetime import datetime, timezone
          print(json.dumps({
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              "cloudflareHealthReachable": True,
              "githubInventoryConfigured": os.environ["INVENTORY_CONFIGURED"] == "true",
              "githubRepositoriesSeen": int(os.environ["REPOSITORIES_SEEN"]),
              "githubProjectsUpserted": int(os.environ["PROJECTS_UPSERTED"]),
              "githubEvidenceCreated": int(os.environ["EVIDENCE_CREATED"]),
              "radarSyncConfigured": os.environ["CONFIGURED"] == "true",
              "githubRadarSyncSecretPresent": os.environ["REPO_SECRET_PRESENT"] == "true",
              "initialSyncStatus": os.environ["SYNC_STATUS"],
              "healthUrl": os.environ["HEALTH_URL"],
          }, indent=2))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/os-radar-bridge.json
          if git diff --cached --quiet; then
            echo "Bridge status unchanged."
          else
            git commit -m "chore: update OS Radar bridge status [skip ci]"
            git push
          fi

          cat status/os-radar-bridge.json
          if [ "$SYNC_STATUS" != "success" ]; then exit 1; fi
