name: Deploy Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync GitHub webhook secret to Cloudflare
        run: printf '%s' "$GITHUB_WEBHOOK_SECRET" | npx wrangler secret put GITHUB_WEBHOOK_SECRET
        env:
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync OS access and Radar bridge secrets to Cloudflare
        run: |
          if [ -n "$OS_ACCESS_TOKEN" ]; then
            printf '%s' "$OS_ACCESS_TOKEN" | npx wrangler secret put OS_ACCESS_TOKEN
          else
            echo "OS_ACCESS_TOKEN not configured in GitHub; leaving the Worker secret unchanged."
          fi
          if [ -n "$RADAR_SYNC_TOKEN" ]; then
            printf '%s' "$RADAR_SYNC_TOKEN" | npx wrangler secret put RADAR_SYNC_TOKEN
          else
            echo "RADAR_SYNC_TOKEN not configured in GitHub; Radar bridge remains disabled."
          fi
        env:
          OS_ACCESS_TOKEN: ${{ secrets.OS_ACCESS_TOKEN }}
          RADAR_SYNC_TOKEN: ${{ secrets.RADAR_SYNC_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Force-enable workers.dev route
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/personal-operating-system/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"enabled":true,"previews_enabled":true}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify workers.dev routing
        run: |
          ACCOUNT_JSON=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          ROUTE_JSON=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/personal-operating-system/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "Account workers.dev response: ${ACCOUNT_JSON}"
          echo "Worker route response: ${ROUTE_JSON}"
          SUBDOMAIN=$(printf '%s' "$ACCOUNT_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')
          URL="https://personal-operating-system.${SUBDOMAIN}.workers.dev/api/health"
          echo "Canonical health URL: ${URL}"
          for i in 1 2 3 4 5 6; do
            if curl --fail-with-body --silent --show-error --max-time 15 "${URL}"; then
              echo
              echo "Public health check passed: ${URL}"
              exit 0
            fi
            echo "Health check attempt ${i} failed; retrying in 10s..."
            sleep 10
          done
          echo "Cloudflare reports the route enabled, but the public hostname is still unreachable: ${URL}"
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
